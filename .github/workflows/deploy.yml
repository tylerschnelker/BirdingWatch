name: Deploy BirdWatch

on:
  push:
    branches: [ "main" ]

# The server half moved from the DigitalOcean droplet to the homelab
# (2026-10-03). The homelab isn't reachable from GitHub and runs no runner,
# so it deploys by hand: scripts/deploy-homelab.sh. Only the Pi deploys here.
jobs:

  deploy-pi:
    runs-on: self-hosted
    steps:
      - name: Update Pi recorder
        run: |
          cd /home/pi/BirdingWatch
          git pull
          sudo systemctl restart birdwatch-recorder
