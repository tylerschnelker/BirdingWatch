<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#2d6a4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BirdWatch">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐦 BirdWatch - Your Backyard Bird Tracker</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="/static/icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <script src="/static/app.js"></script>
</head>
<body>
    <header>
        <div class="header-content">
            <h1>🐦 BirdWatch</h1>
            <p class="subtitle">Your backyard bird tracker</p>
            <div class="live-indicator">
                <span class="live-dot"></span>
                <span class="live-text">Live</span>
            </div>
            <button id="notify-toggle-btn" class="notify-toggle" style="display:none;">🔔 Enable notifications</button>
        </div>
    </header>

    <nav class="tabs">
        <button class="tab-button active" data-tab="recent">Recent Detections</button>
        <button class="tab-button" data-tab="species">Species Summary</button>
    </nav>

    <main>
        <section id="recent-tab" class="tab-content active">
            <div class="date-nav">
                <button id="prev-day-btn" class="date-nav-button" aria-label="Previous day">&larr;</button>
                <span id="current-date-label" class="date-nav-label">Today</span>
                <button id="next-day-btn" class="date-nav-button" aria-label="Next day">&rarr;</button>
            </div>
            <div id="detections-container" class="detections-feed">
                <div class="loading">Loading detections...</div>
            </div>
        </section>

        <section id="species-tab" class="tab-content">
            <div id="species-container" class="species-list">
                <div class="loading">Loading species data...</div>
            </div>
        </section>
    </main>

    <footer>
        <p>BirdWatch - Powered by BirdNET-Analyzer</p>
    </footer>
<script>
    if ('serviceWorker' in navigator) {
        // Clean up the old mis-scoped registration (served from /static/sw.js,
        // whose default scope was /static/ - it could never actually control
        // the app's real pages, only requests already under /static/).
        navigator.serviceWorker.getRegistrations().then(regs => {
            regs.forEach(reg => {
                if (reg.scope.endsWith('/static/')) reg.unregister();
            });
        });
        navigator.serviceWorker.register('/sw.js')
            .then(() => console.log('Service Worker registered'))
            .catch(err => console.log('Service Worker error:', err));
    }
</script>
</body>
</html>
